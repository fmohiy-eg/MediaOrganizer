# Media Organizer configuration.
# Copy to config.yaml (gitignored) and edit — or just run: python setup_wizard.py
# API keys can live here, but a .env file (see .env.example) is recommended and
# overrides these. Precedence per key: environment > .env > this file.

# --- Library paths (scanned recursively) ---
# Point these at your movies and TV folders. The roots are matched by name: one
# containing "movie" and one containing "tv"/"show". Single-machine: use local or
# mounted paths (e.g. /mnt/media/Movies, D:/Media/TV Shows). NAS+PC split: use the
# SMB paths and fill in path_map below.
media_paths:
  - /mnt/media/Movies
  - /mnt/media/TV Shows

# --- Storage / runtime (local-friendly defaults) ---
database_path: ./media_audit.db
log_directory: ./logs
quarantine_path: ./quarantine          # single central quarantine ("deleted" files move here)

# --- Web dashboard bind address ---
# Change `port` to run more than one instance at once (e.g. this app alongside another
# copy on 8080). A CLI port arg overrides this: python run_dashboard.py config.yaml 8082
server:
  host: 0.0.0.0
  port: 8081

# Optional label shown in the dashboard header + browser tab, to tell instances apart
# when running several side by side. Leave empty for none.
instance_name: ""

# --- NAS+PC split only: map stored (NAS) path prefixes to locally-reachable (SMB) ---
# Leave empty {} for single-machine (paths are used as-is). For a split deployment the
# catalog stores the NAS-side prefix and the dashboard translates it to SMB for disk ops:
#   path_map:
#     "/share/Movies": "\\\\192.168.1.10\\Movies"
#     "/share/TV Shows": "\\\\192.168.1.10\\TV Shows"
path_map: {}

# --- External API credentials (prefer .env — see .env.example) ---
api_keys:
  tmdb: ""               # TMDB (movies)
  tvdb: ""               # TVDB v4 (TV)
  opensubtitles:
    api_key: ""
    username: ""         # optional; the dashboard can also log in interactively
    password: ""

# --- External tooling (binary "" => auto-detect on PATH, then platform defaults) ---
ffprobe:
  binary: ""             # e.g. /usr/bin/ffprobe or C:\tools\ffprobe.exe; "" = auto-detect
  timeout_seconds: 30
  retries: 3
player:
  binary: ""             # VLC or other; "" = auto-detect VLC, else OS default association

# --- Audio-language flagging (optional) ---
# List movies whose audio track matches `languages` and offer a one-click move into
# `staging_subdir`. Leave languages empty [] to hide the feature entirely.
# Example (flag Arabic-audio movies):
#   audio_flag:
#     languages: ["ara", "ar"]
#     label: "Arabic Audio"
#     staging_subdir: "02-ArabicReady"
audio_flag:
  languages: []
  label: "Flagged Audio"
  staging_subdir: "02-Ready"

# --- Hashing thresholds ---
hashing:
  partial_hash_threshold_bytes: 20000000   # files larger than this use head/tail partial hashing
  partial_chunk_bytes: 10000000            # head & tail chunk size for fast_hash

# --- Audit thresholds ---
audit:
  duration_deviation_seconds: 120          # Release Protection tolerance vs. theatrical runtime
  variant_priority:                        # quality ranking order (first = strongest)
    - resolution
    - bitrate
    - codec        # HEVC/AV1 preferred over H.264
    - audio_channels

# --- API behavior ---
api:
  max_retries: 2
  retry_backoff_seconds: 5
  cache_ttl_days: 30

# --- Scan behavior ---
scan:
  worker_threads: 4
  # Modern + legacy formats (legacy indexed so duplicates/cleanup candidates surface)
  valid_extensions: [".mkv", ".mp4", ".avi", ".m4v", ".mov", ".ts", ".wmv", ".webm",
                     ".rm", ".rmvb", ".mpg", ".mpeg", ".flv", ".vob", ".m2ts", ".divx"]

# --- Safety ---
safety:
  dry_run_default: true                    # preview before any destructive action
